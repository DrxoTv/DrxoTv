<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRX TV - Dizi ve Film Platformu</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #fff;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* NAVBAR */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: linear-gradient(to bottom, rgba(13,17,23,0.95), rgba(13,17,23,0));
            position: fixed;
            width: 100%;
            z-index: 100;
        }
        .logo {
            color: #26d07c; /* SU YEŞİLİ */
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(38, 208, 124, 0.3);
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
        }
        .nav-links a {
            color: #e5e5e5;
            text-decoration: none;
            font-size: 14px;
            transition: 0.3s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #26d07c;
        }

        /* BANNER */
        .banner {
            background: linear-gradient(to right, rgba(13,17,23,0.85), rgba(13,17,23,0.2)), url('https://images.unsplash.com/photo-1616530940355-351facd9524b?q=80&w=1920') no-repeat center center/cover;
            height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 5%;
            position: relative;
        }
        .banner-content {
            max-width: 500px;
            padding-right: 20px;
        }
        .banner-title {
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .banner-desc {
            font-size: 15px;
            color: #cccccc;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        /* SU YEŞİLİ MODERN BUTONLAR */
        .btn {
            padding: 12px 26px;
            background-color: #26d07c;
            color: #0d1117;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(38, 208, 124, 0.2);
        }
        .btn:hover {
            background-color: #1faa6b;
            transform: translateY(-2px);
        }

        /* İÇERİK SATIRLARI */
        .content-row {
            padding: 25px 0 10px 5%;
        }
        .row-title {
            font-size: 20px;
            margin-bottom: 15px;
            color: #fff;
            border-left: 4px solid #26d07c;
            padding-left: 10px;
        }
        .card-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 15px;
            scroll-behavior: smooth;
        }
        .card-container::-webkit-scrollbar {
            display: none;
        }
        .card {
            min-width: 200px;
            max-width: 200px;
            height: 280px;
            background-color: #161b22;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid #21262d;
        }
        .card:hover {
            transform: scale(1.05);
            border-color: #26d07c;
            box-shadow: 0 0 15px rgba(38, 208, 124, 0.2);
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.75;
            transition: 0.3s;
        }
        .card:hover img {
            opacity: 0.9;
        }
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 10px 10px 10px;
            font-size: 14px;
            font-weight: bold;
            background: linear-gradient(to top, rgba(0,0,0,0.9), rgba(0,0,0,0));
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* VİDEO OYNATICI PENCERESİ */
        .video-player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            position: relative;
            width: 95%;
            max-width: 850px;
            background-color: #0d1117;
            border: 2px solid #26d07c;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(38, 208, 124, 0.3);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 35px;
            cursor: pointer;
            z-index: 1001;
            transition: 0.3s;
        }
        .close-btn:hover {
            color: #26d07c;
        }
        .video-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 75vh;
        }
    </style>
</head>
<body>

    <!-- ÜST MENÜ -->
    <header>
        <a href="#" class="logo">DRX TV</a>
        <ul class="nav-links">
            <li><a href="#" class="active"><i class="fas fa-home"></i> Ana Sayfa</a></li>
            <li><a href="#"><i class="fas fa-film"></i> Filmler</a></li>
            <li><a href="#"><i class="fas fa-tv"></i> Diziler</a></li>
        </ul>
    </header>

    <!-- KANVAS BAŞLIK (BANNER) -->
    <section class="banner">
        <div class="banner-content">
            <h1 class="banner-title">Yüzüklerin Efendisi</h1>
            <p class="banner-desc">Güç yüzüklerinin dövüldüğü, krallıkların yükselip çöktüğü o efsanevi döneme DRX TV kalitesiyle tanıklık edin.</p>
            <!-- Öne çıkan film klasör yolu -->
            <button class="btn" onclick="playDRXVideo('VidexoTv/lotr/film.mp4')">
                <i class="fas fa-play"></i> Hemen İzle
            </button>
        </div>
    </section>

    <!-- ŞABLON SATIRLARI (JAVASCRIPT OTOMATİK DOLDURACAK) -->
    <div class="content-row">
        <h2 class="row-title">🎬 Popüler Filmler</h2>
        <div id="filmler-listesi" class="card-container">
            <!-- Filmler buraya otomatik eklenecek -->
        </div>
    </div>

    <div class="content-row">
        <h2 class="row-title">🔥 Trend Diziler</h2>
        <div id="diziler-listesi" class="card-container">
            <!-- Diziler buraya otomatik eklenecek -->
        </div>
    </div>

    <!-- VİDEO OYNATICI MODAL -->
    <div id="videoModal" class="video-player-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeDRXVideo()">&times;</span>
            <div class="video-wrapper">
                <video id="drxPlayer" controls autoplay playsinline></video>
            </div>
        </div>
    </div>

    <!-- 🛠️ DRX TV AKILLI ARŞİV MOTORU VE YÖNETİM LİSTESİ -->
    <script>
        // =================================================================
        // 📥 BURASI SENİN ARŞİVİN! YENİ İÇERİKLERİ SADECE BURAYA EKLEYECEKSİN
        // =================================================================
        
        // 🎬 FİLMLER LİSTESİ
        const DRX_Filmler = [
            { 
                ad: "Interstellar", 
                videoYolu: "VidexoTv/interstellar/film.mp4", 
                afisUrl: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?q=80&w=400" 
            },
            { 
                ad: "Inception", 
                videoYolu: "VidexoTv/inception/film.mp4", 
                afisUrl: "https://images.unsplash.com/photo-1478760329108-5c3ed9d495a0?q=80&w=400" 
            },
            { 
                ad: "The Dark Knight", 
                videoYolu: "VidexoTv/dark-knight/film.mp4", 
                afisUrl: "https://images.unsplash.com/photo-1509281373149-e957c6296406?q=80&w=400" 
            }
        ];

        // 🔥 DİZİLER LİSTESİ
        const DRX_Diziler = [
            { 
                ad: "Sonic ile hikaye vakti", 
                videoYolu: "VidexoTv/hikayevakti/dizi.mp4", 
                afisUrl: "https://images.unsplash.com/photo-1578301978693-85fa9c0320b9?q=80&w=400" 
            },
            { 
                ad: "Mutluluk Diyarı", 
                videoYolu: "VidexoTv/mutlulukdiyari/dizi.mp4", 
                afisUrl: "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=400" 
            },
            { 
                ad: "Sonic X bölüm 1", 
                videoYolu: "VidexoTv/sonicx/dizi1.mp4", 
                afisUrl: "https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?q=80&w=400" 
            }
        ];

        // =================================================================
        // ⚙️ SİSTEM MOTORU (BU KISMA HİÇ DOKUNMA, KENDİ KENDİNE ÇALIŞIR)
        // =================================================================
        
        function kartlariOlustur() {
            const filmKutusu = document.getElementById('filmler-listesi');
            const diziKutusu = document.getElementById('diziler-listesi');
            
            // Filmleri Bas
            DRX_Filmler.forEach(film => {
                filmKutusu.innerHTML += `
                    <div class="card" onclick="playDRXVideo('${film.videoYolu}')">
                        <img src="${film.afisUrl}" alt="${film.ad}">
                        <div class="card-title">${film.ad}</div>
                    </div>
                `;
            });

            // Dizileri Bas
            DRX_Diziler.forEach(dizi => {
                diziKutusu.innerHTML += `
                    <div class="card" onclick="playDRXVideo('${dizi.videoYolu}')">
                        <img src="${dizi.afisUrl}" alt="${dizi.ad}">
                        <div class="card-title">${dizi.ad}</div>
                    </div>
                `;
            });
        }

        // Sayfa açıldığında listeleri yükle
        window.onload = kartlariOlustur;

        // Oynatıcı Fonksiyonları
        function playDRXVideo(videoFilePath) {
            const modal = document.getElementById('videoModal');
            const videoElement = document.getElementById('drxPlayer');
            
            videoElement.src = videoFilePath; 
            modal.style.display = 'flex';
            videoElement.play().catch(function(error) {
                alert("Bu içerik şu an DRX TV arşivine yükleniyor, lütfen daha sonra tekrar deneyin!");
                closeDRXVideo();
            });
        }

        function closeDRXVideo() {
            const modal = document.getElementById('videoModal');
            const videoElement = document.getElementById('drxPlayer');
            
            modal.style.display = 'none';
            videoElement.pause();
            videoElement.src = '';
        }
    </script>
</body>
</html>
